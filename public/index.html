<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <meta name="theme-color" content="#1f3b2c" />
    <meta
      name="description"
      content="Read it, write in it, and pass it on. A shared reading journey for one copy and many readers."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Traveling Books" />
    <!-- How a shared link looks: invite links are how people arrive. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Traveling Books" />
    <meta property="og:title" content="The Traveling Books" />
    <meta
      property="og:description"
      content="Read it, write in it, and pass it on. One copy of a book travels around a group of friends, and the app keeps its journey."
    />
    <meta property="og:url" content="https://itang1.github.io/book-club/" />
    <meta property="og:image" content="https://itang1.github.io/book-club/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Traveling Books crest, with the motto Lege, Scribe, Trade"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Visit counts (GoatCounter, added on deploy) see the page's path only,
         never the query string, which can carry a group's invite code. -->
    <script>
      window.goatcounter = {
        path: function () {
          return location.pathname;
        },
      };
    </script>
    <link rel="apple-touch-icon" href="icon.png" />
    <link rel="manifest" href="manifest.json" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* The letterhead green until the app paints, so loading never flashes white. */
      body {
        background: #1f3b2c;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
