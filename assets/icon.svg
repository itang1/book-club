  <path d="M150 860 C 260 700, 300 620, 420 600 S 700 560, 790 300" fill="none" stroke="#b98a7a" stroke-width="26" stroke-linecap="round" stroke-dasharray="1 58"/>
  <!-- library stamp at the end of the route -->
  <g transform="translate(800 250) rotate(-14)">
    <circle r="118" fill="#f6e1dc"/>
    <circle r="118" fill="none" stroke="#a6463a" stroke-width="18"/>
    <circle r="86" fill="none" stroke="#a6463a" stroke-width="7" stroke-dasharray="14 12"/>
    <path d="M-40 4 L-10 34 L46 -30" fill="none" stroke="#a6463a" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- the book -->
  <g transform="translate(455 575) rotate(-9) scale(1.14)">
    <rect x="-170" y="-215" width="350" height="440" rx="26" fill="#eaded3"/>
    <rect x="-160" y="-230" width="340" height="440" rx="26" fill="#fffdfb" stroke="#eaded3" stroke-width="6"/>
    <rect x="-190" y="-240" width="345" height="445" rx="26" fill="#c89366"/>
    <rect x="-190" y="-240" width="62" height="445" rx="26" fill="#7a5c48"/>
    <rect x="-150" y="-240" width="22" height="445" fill="#7a5c48"/>
    <rect x="-80" y="-150" width="180" height="22" rx="11" fill="#fffdfb" opacity=".85"/>
    <rect x="-80" y="-108" width="120" height="22" rx="11" fill="#fffdfb" opacity=".6"/>
    <path d="M70 205 L70 290 L100 262 L130 290 L130 205 Z" fill="#a6463a"/>
  </g>
</svg>
