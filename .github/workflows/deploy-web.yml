# On every push to main: applies supabase/schema.sql to the database, then
# builds the web app and publishes it to GitHub Pages.
#
# One-time setup in the repo on GitHub:
#   Settings → Pages → Source: "GitHub Actions"
#   Settings → Secrets and variables → Actions → Secrets:
#     EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY
#     SUPABASE_DB_URL  (optional; enables the schema sync, see below)
#
# Both values end up inside the published JavaScript, as all EXPO_PUBLIC_
# values do; storing them as secrets only keeps them out of the build logs.
# Leave them unset to publish the fictional demo group instead.
name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ubuntu-24.04 rather than ubuntu-latest, so GitHub moving "latest" to a
  # new image can't change psql or Node underneath us without warning.
  #
  # schema.sql is written to be re-runnable, so applying it on every push is
  # safe, and it keeps the database in step with the app that's about to ship.
  # One transaction: if any statement fails, nothing changes and the deploy
  # below doesn't run.
  #
  # SUPABASE_DB_URL is the "Session pooler" connection string from the
  # Supabase dashboard (Connect button), with your database password filled in.
  # The session pooler matters: GitHub's runners can't reach the direct
  # connection, which is IPv6 only. Unlike the anon key, this is a real
  # secret: it can do anything to the database, so it lives only here and
  # never in an EXPO_PUBLIC_ variable.
  # The access rules, checked as real signed-in users against a throwaway
  # Postgres, before anything touches the real database.
  db-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - run: supabase/tests/run.sh
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres

  schema:
    needs: db-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Apply supabase/schema.sql
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::notice::SUPABASE_DB_URL isn't set, so the schema wasn't synced. Run supabase/schema.sql by hand if it changed."
            exit 0
          fi
          # The direct connection (db.<ref>.supabase.co) is IPv6 only, which
          # GitHub's runners can't reach. Catch it with a clear message rather
          # than "Network is unreachable".
          case "$SUPABASE_DB_URL" in
            *@db.*.supabase.co*)
              echo "::error::SUPABASE_DB_URL is the Direct connection string. Replace it with the Session pooler one (Supabase → Connect → Session pooler; its host ends in pooler.supabase.com)."
              exit 1
              ;;
          esac
          # A busy moment (someone using the app) can still make Postgres
          # cancel the transaction; it rolls back cleanly, so just try again.
          for attempt in 1 2 3; do
            if psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --single-transaction --quiet \
                 -c "set lock_timeout = '15s'" -f supabase/schema.sql -f supabase/sample.sql; then
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          exit 1

  # The email sender (supabase/functions/notify). Skipped until
  # SUPABASE_ACCESS_TOKEN is set (Supabase → Account → Access Tokens). The
  # mail account's details come from SMTP_USER / SMTP_PASS (e.g. a Gmail
  # address and an app password) and are copied into the function's own
  # secrets on each deploy.
  email-function:
    needs: schema
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Pinned, so a new CLI release can't change a deploy without a commit.
      # Bump by hand (npm view supabase version) when there's a reason to.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Deploy the notify function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN isn't set, so the email function wasn't deployed."
            exit 0
          fi
          # https://<project-ref>.supabase.co
          REF=$(echo "$SUPABASE_URL" | sed -E 's#https?://([^.]+)\..*#\1#')
          if [ -n "$SMTP_USER" ]; then
            supabase secrets set --project-ref "$REF" \
              SMTP_USER="$SMTP_USER" SMTP_PASS="$SMTP_PASS" \
              APP_URL="https://itang1.github.io/book-club/"
          fi
          supabase functions deploy notify --project-ref "$REF"
          # Sign-in emails, through the Supabase Management API, in two steps:
          # first delivery through the Gmail account (given SMTP secrets) rather
          # than Supabase's shared sender, which allows only a few an hour; then
          # the house-style template (supabase/templates/sign-in.html), which
          # Supabase only accepts once a custom sender is set. Failures warn,
          # print Supabase's answer, and don't stop the deploy.
          auth_config() {
            curl -sS --fail-with-body -X PATCH "https://api.supabase.com/v1/projects/$REF/config/auth" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
              --data @"$1" -o /tmp/auth-response.json \
              || { echo "::warning::Couldn't update sign-in emails ($2): $(cat /tmp/auth-response.json)"; return 1; }
          }
          if [ -n "$SMTP_USER" ]; then
            jq -n --arg user "$SMTP_USER" --arg pass "$SMTP_PASS" '{
                smtp_host: "smtp.gmail.com",
                smtp_port: "465",
                smtp_user: $user,
                smtp_pass: $pass,
                smtp_admin_email: $user,
                smtp_sender_name: "The Traveling Books",
                rate_limit_email_sent: 60
              }' > /tmp/auth-smtp.json
            if auth_config /tmp/auth-smtp.json "delivery"; then
              jq -n --rawfile html supabase/templates/sign-in.html '{
                  mailer_subjects_magic_link: "Your link to The Traveling Books",
                  mailer_templates_magic_link_content: $html,
                  mailer_subjects_confirmation: "Your link to The Traveling Books",
                  mailer_templates_confirmation_content: $html
                }' > /tmp/auth-template.json
              auth_config /tmp/auth-template.json "template" || true
            fi
          else
            echo "::notice::SMTP_USER isn't set, so sign-in emails keep Supabase's default sender and template."
          fi
          # Shelf scanning: only once there's a key for it.
          if [ -n "$GEMINI_API_KEY" ]; then
            supabase secrets set --project-ref "$REF" GEMINI_API_KEY="$GEMINI_API_KEY"
            supabase functions deploy scan-shelf --project-ref "$REF"
          fi

  build:
    needs: schema
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Stop before publishing if the types, lint, formatting or core rules are broken.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npx expo export --platform web --output-dir dist
        env:
          EXPO_BASE_URL: /book-club
          EXPO_PUBLIC_APP_URL: https://itang1.github.io/book-club
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      # Visit counts on the same GoatCounter dashboard as itang1.github.io.
      - run: sed -i 's|</body>|<script data-goatcounter="https://itang1.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script></body>|' dist/index.html
      # Pages serves 404.html for unknown paths; make that the app too.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
