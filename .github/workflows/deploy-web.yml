# On every push to main: applies supabase/schema.sql to the database, then
# builds the web app and publishes it to GitHub Pages.
#
# One-time setup in the repo on GitHub:
#   Settings → Pages → Source: "GitHub Actions"
#   Settings → Secrets and variables → Actions → Secrets:
#     EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY
#     SUPABASE_DB_URL  (optional; enables the schema sync, see below)
#
# Both values end up inside the published JavaScript, as all EXPO_PUBLIC_
# values do; storing them as secrets only keeps them out of the build logs.
# Leave them unset to publish the fictional demo group instead.
name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ubuntu-24.04 rather than ubuntu-latest, so GitHub moving "latest" to a
  # new image can't change psql or Node underneath us without warning.
  #
  # schema.sql is written to be re-runnable, so applying it on every push is
  # safe, and it keeps the database in step with the app that's about to ship.
  # One transaction: if any statement fails, nothing changes and the deploy
  # below doesn't run.
  #
  # SUPABASE_DB_URL is the "Session pooler" connection string from the
  # Supabase dashboard (Connect button), with your database password filled in.
  # The session pooler matters: GitHub's runners can't reach the direct
  # connection, which is IPv6 only. Unlike the anon key, this is a real
  # secret: it can do anything to the database, so it lives only here and
  # never in an EXPO_PUBLIC_ variable.
  schema:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply supabase/schema.sql
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::notice::SUPABASE_DB_URL isn't set, so the schema wasn't synced. Run supabase/schema.sql by hand if it changed."
            exit 0
          fi
          # The direct connection (db.<ref>.supabase.co) is IPv6 only, which
          # GitHub's runners can't reach. Catch it with a clear message rather
          # than "Network is unreachable".
          case "$SUPABASE_DB_URL" in
            *@db.*.supabase.co*)
              echo "::error::SUPABASE_DB_URL is the Direct connection string. Replace it with the Session pooler one (Supabase → Connect → Session pooler; its host ends in pooler.supabase.com)."
              exit 1
              ;;
          esac
          # A busy moment (someone using the app) can still make Postgres
          # cancel the transaction; it rolls back cleanly, so just try again.
          for attempt in 1 2 3; do
            if psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --single-transaction --quiet \
                 -c "set lock_timeout = '15s'" -f supabase/schema.sql; then
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          exit 1

  build:
    needs: schema
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Stop before publishing if the types or the core rules are broken.
      - run: npm run typecheck
      - run: npm test
      - run: npx expo export --platform web --output-dir dist
        env:
          EXPO_BASE_URL: /book-club
          EXPO_PUBLIC_APP_URL: https://itang1.github.io/book-club
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      # Visit counts on the same GoatCounter dashboard as itang1.github.io.
      - run: sed -i 's|</body>|<script data-goatcounter="https://itang1.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script></body>|' dist/index.html
      # Pages serves 404.html for unknown paths; make that the app too.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
