# Builds the web app and publishes it to GitHub Pages on every push to main.
#
# One-time setup in the repo on GitHub:
#   Settings → Pages → Source: "GitHub Actions"
#   Settings → Secrets and variables → Actions → Secrets:
#     EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY
#
# Both values end up inside the published JavaScript, as all EXPO_PUBLIC_
# values do; storing them as secrets only keeps them out of the build logs.
# Leave them unset to publish the fictional demo group instead.
name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo export --platform web --output-dir dist
        env:
          EXPO_BASE_URL: /book-club
          EXPO_PUBLIC_APP_URL: https://itang1.github.io/book-club
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      # Pages serves 404.html for unknown paths; make that the app too.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
