# One-off, run by hand: confirms the real-data SQL landed, printing only
# counts and ids (this repo's logs are public, so no names).
name: Check data

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Counts
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          select g.id as group_id, g.is_sample,
                 (select count(*) from group_members m where m.group_id = g.id) as members,
                 (select count(*) from books b where b.group_id = g.id) as books
          from groups g order by g.id;

          select b.id as book_id, b.group_id, b.gifted_by is not null as gift,
                 (select count(*) from handoffs h where h.book_id = b.id) as legs,
                 (select count(*) from handoffs h where h.book_id = b.id and h.received_at is null) as in_post
          from books b join groups g on g.id = b.group_id
          where not g.is_sample order by b.id;

          select (select count(*) from books where id in ('book-local-1', 'book-local-2')) as deleted_books_left,
                 (select count(*) from friends where id in ('friend-albert', 'friend-chenda')) as albert_and_chenda,
                 (select count(*) from friends where name ilike 'irene%') as irenes,
                 (select count(*) from friends where user_id is not null) as signed_in_people;
          SQL
