name: Keep Supabase awake

# Supabase pauses free-tier projects after roughly a week of inactivity, and
# this app is idle for days at a time. API requests count as activity, so a
# periodic no-op query keeps the project from being paused — otherwise the
# first person to open the app after a quiet week finds it broken until the
# project is manually restored from the dashboard.
#
# Runs every 3 days, so a single missed run still leaves margin before the
# ~7-day pause window.
#
# Two things worth knowing:
#   * GitHub disables scheduled workflows on repos with no activity for 60
#     days. If this repo itself goes quiet that long, the cron stops and the
#     project will eventually pause. Re-enable it in the Actions tab.
#   * This is a workaround for a platform behaviour, not a guarantee. After the
#     first quiet week, check the Supabase dashboard to confirm it held.

on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

# Never run two pings at once, and don't queue up a backlog.
concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          # Skip quietly until the project exists and the secrets are set, so
          # this doesn't sit red in the Actions tab in the meantime.
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::notice title=Skipped::Set the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets to enable the keep-alive ping."
            exit 0
          fi

          # The PostgREST root introspects the database to build its OpenAPI
          # spec, so this touches Postgres without depending on any particular
          # table existing yet.
          #
          # Retries are a hand-rolled loop rather than curl's --retry: curl
          # writes its -w output once per attempt, so combining --retry with a
          # fallback concatenates the codes into nonsense like "000000".
          attempt=1
          attempts=3
          status=000

          while [ "${attempt}" -le "${attempts}" ]; do
            if status="$(
              curl -sS --max-time 30 \
                -o /tmp/keepalive-body -w '%{http_code}' \
                "${SUPABASE_URL%/}/rest/v1/" \
                -H "apikey: ${SUPABASE_ANON_KEY}" \
                2>/tmp/keepalive-err
            )"; then
              :
            else
              status=000
              echo "attempt ${attempt}: $(head -c 200 /tmp/keepalive-err 2>/dev/null || true)"
            fi

            # Guard against anything non-numeric reaching the comparison.
            case "${status}" in
              ''|*[!0-9]*) status=000 ;;
            esac

            if [ "${status}" -ge 200 ] && [ "${status}" -lt 400 ]; then
              echo "::notice title=Awake::Supabase responded ${status}."
              exit 0
            fi

            echo "attempt ${attempt}/${attempts} returned ${status}"
            attempt=$((attempt + 1))

            if [ "${attempt}" -le "${attempts}" ]; then
              sleep 10
            fi
          done

          echo "::error title=Ping failed::Supabase returned ${status} after ${attempts} attempts. If the project was already paused, restore it from the dashboard — a paused project cannot be woken by this request."
          head -c 2000 /tmp/keepalive-body 2>/dev/null || true
          exit 1
