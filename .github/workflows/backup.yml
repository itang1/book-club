# Nightly backup of the real data (people, books, handoffs, notes, queues, and
# the sign-in emails), so a mistake or a dead free-tier project can't take the
# group's history with it.
#
# The dump is encrypted before it leaves the runner, because this repo is
# public and so are its workflow artifacts; without BACKUP_PASSPHRASE the file
# is unreadable. Kept 90 days, the most GitHub allows.
#
# Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL    already set for the deploy
#   BACKUP_PASSPHRASE  new: a long random passphrase. Keep a copy somewhere
#                      else too (a password manager): lose it and the backups
#                      can't be opened.
#
# Restore, into a project whose schema.sql has already been applied:
#   gpg --decrypt club-YYYY-MM-DD.sql.gz.gpg | gunzip | psql "$DB_URL"
#
# Handoffs are append-only, so a restore is a straight data load.
name: Backup

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Dump and encrypt
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Set SUPABASE_DB_URL and BACKUP_PASSPHRASE to back up."
            exit 1
          fi
          # pg_dump must be at least as new as the server, which is newer than
          # Ubuntu's own client.
          sudo apt-get install -y postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y postgresql-client-17 >/dev/null

          name="club-$(date -u +%F)"
          # Data only: the schema lives in the repo (supabase/schema.sql).
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --data-only --no-owner --no-privileges \
            --schema=public --table=auth.users \
            | gzip -9 \
            | gpg --batch --yes --pinentry-mode loopback --symmetric \
                --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" \
                --output "$name.sql.gz.gpg"
          # An empty or truncated dump should fail loudly, not look like a backup.
          test "$(stat -c %s "$name.sql.gz.gpg")" -gt 1000
          echo "NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.sql.gz.gpg
          retention-days: 90
          if-no-files-found: error
