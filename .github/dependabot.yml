# Weekly, grouped, so updates arrive as a couple of pull requests rather than
# a stream. Only minor and patch versions: a major upgrade (TypeScript,
# ESLint, Vitest) changes behaviour and is done deliberately, one at a time.
# Expo SDK upgrades are done by hand (npx expo install --fix), so Expo, React
# Native and eslint-config-expo (versioned with the SDK) are left alone here.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-config-expo'
      - dependency-name: 'expo*'
      - dependency-name: 'react-native*'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: '@expo/*'
      - dependency-name: '@react-native*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
